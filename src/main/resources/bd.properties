# Conexión a MySQL 8.0 para ImcWeb.
# 1) Si GlassFish tiene el recurso JNDI jdbc/imcDb (pool de conexiones), se usa ese.
# 2) Si no existe, la aplicación se conecta directamente con estos datos.
# El usuario imcApp se crea con database/imcDb.sql y solo tiene acceso a imcDb desde localhost.
bd.jndi=jdbc/imcDb
bd.driver=com.mysql.cj.jdbc.Driver
bd.url=jdbc:mysql://localhost:3306/imcDb?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
bd.usuario=imcApp
bd.contrasena=ImcApp2026!
